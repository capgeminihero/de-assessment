resources:
  jobs:
    tvmaze_pipeline:
      name: "TVMaze Pipeline (${var.environment})"
      description: "Bronze → Silver → Gold ingestion pipeline for TVMaze data"

      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4s_v3
            num_workers: ${var.num_workers}
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"

      tasks:
        - task_key: bronze_ingestion
          description: "Ingest raw TVMaze data from API to Delta bronze layer"
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ../../../notebooks/01_bronze_ingestion.ipynb
            base_parameters:
              catalog: ${var.catalog}
              environment: ${var.environment}
              log_level: ${var.log_level}

        - task_key: silver_transformation
          description: "Clean and type-cast bronze data to silver layer"
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ../../../notebooks/02_silver_transformation.ipynb
            base_parameters:
              catalog: ${var.catalog}
              environment: ${var.environment}
              log_level: ${var.log_level}

        - task_key: gold_aggregation
          description: "Aggregate silver data into gold fact tables"
          depends_on:
            - task_key: silver_transformation
          job_cluster_key: pipeline_cluster
          notebook_task:
            notebook_path: ../../../notebooks/03_gold_aggregation.ipynb
            base_parameters:
              catalog: ${var.catalog}
              environment: ${var.environment}
              log_level: ${var.log_level}

      email_notifications:
        on_failure:
          - ${var.environment}-alerts@de-assessment.local

      tags:
        environment: ${var.environment}
        project: de-assessment
        managed_by: databricks-asset-bundles
